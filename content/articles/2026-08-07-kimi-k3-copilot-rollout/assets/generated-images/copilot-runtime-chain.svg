    <text x="238" y="510" fill="#172033" font-size="29" font-weight="700">平台编排</text><text x="238" y="546" fill="#657084" font-size="24">GitHub Copilot</text>

    <path d="M600 572v30" stroke="#1f5eff" stroke-width="5"/><path d="M586 595l14 16 14-16" fill="none" stroke="#1f5eff" stroke-width="5"/>
