    <path d="M600 284v30" stroke="#1f5eff" stroke-width="5"/><path d="M586 307l14 16 14-16" fill="none" stroke="#1f5eff" stroke-width="5"/>
    <rect x="120" y="324" width="960" height="104" rx="20" fill="#ffffff" stroke="#dfe5ef" stroke-width="2"/>
