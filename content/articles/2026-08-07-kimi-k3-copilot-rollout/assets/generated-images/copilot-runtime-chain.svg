  <rect x="120" y="892" width="960" height="2" fill="#dfe5ef"/>
  <circle cx="137" cy="925" r="8" fill="#d79a2b"/><text x="160" y="934" fill="#465166" font-family="Noto Sans CJK SC, sans-serif" font-size="23">任何一层中断，都可能让 Agent 任务无法闭环</text>
