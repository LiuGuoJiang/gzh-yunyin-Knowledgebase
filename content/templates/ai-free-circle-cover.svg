<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <clipPath id="cover-clip"><rect width="1080" height="1440" rx="0"/></clipPath>
    <linearGradient id="cover-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9faf8" stop-opacity="0.98"/>
      <stop offset="0.47" stop-color="#f9faf8" stop-opacity="0.78"/>
      <stop offset="0.7" stop-color="#f9faf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f9faf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#cover-clip)">
    <image href="{{ART_HREF}}" width="1080" height="1440" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1080" height="940" fill="url(#cover-fade)"/>
    <rect x="72" y="72" width="162" height="54" rx="10" fill="#2367e8"/>
    <text x="153" y="108" text-anchor="middle" fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" letter-spacing="2">AI自由圈</text>
