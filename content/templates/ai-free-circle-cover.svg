    <text x="72" y="322" fill="#172033" font-family="Noto Sans CJK SC, sans-serif" font-size="76" font-weight="800">{{TITLE_LINE1}}</text>
    <text x="72" y="426" fill="#172033" font-family="Noto Sans CJK SC, sans-serif" font-size="76" font-weight="800">{{TITLE_LINE2}}</text>
    <rect x="72" y="482" width="118" height="8" rx="4" fill="#2367e8"/>
    <text x="72" y="1360" fill="#657086" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" letter-spacing="2">AI NEWS · TOOL · ACTION</text>
    <text x="1008" y="1360" text-anchor="end" fill="#657086" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600">2026</text>
  </g>
</svg>
